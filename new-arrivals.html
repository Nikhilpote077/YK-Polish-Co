<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Arrivals — YK Polish Co.</title>
    <meta
      name="description"
      content="Fresh press-on nail designs from YK Polish Co."
    />
    <meta name="theme-color" content="#17131c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
  </head>
  <body data-base="">
    <div id="site-header-root"></div>
    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow">the latest</span>
          <h1>New designs, just in.</h1>
          <p>Fresh press-on nail designs from YK Polish Co.</p>
        </div>
      </section>
      <section class="section-pad">
        <div class="container">
          <div class="product-grid" id="specialGrid"></div>
        </div>
      </section>
    </main>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("specialGrid").innerHTML = PRODUCTS.filter(
          x.isNew,
        )
          .map(productCard)
          .join("");
      });
    </script>
    <div id="site-footer-root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/filters.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
