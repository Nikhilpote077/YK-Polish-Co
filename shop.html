<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Press-On Nails — YK Polish Co.</title>
    <meta
      name="description"
      content="Explore YK Polish Co. press-on nails by style, colour and mood."
    />
    <meta name="theme-color" content="#17131c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
  </head>
  <body data-base="">
    <div id="site-header-root"></div>
    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow">the collection</span>
          <h1>Press-ons for every mood, moment & occasion.</h1>
          <p>
            Browse ready-to-wear designs, then narrow the edit by style, colour
            or collection.
          </p>
        </div>
      </section>
      <section class="section-pad">
        <div class="container">
          <div class="filter-bar">
            <a data-filter-link href="shop.html">All</a
            ><a data-filter-link href="shop.html?style=minimal">Minimal</a
            ><a data-filter-link href="shop.html?style=floral">Floral</a
            ><a data-filter-link href="shop.html?style=french">French</a
            ><a data-filter-link href="shop.html?style=glam">Glam</a
            ><a data-filter-link href="shop.html?style=chrome">Chrome</a
            ><a data-filter-link href="shop.html?colour=nude">Nude</a
            ><a data-filter-link href="shop.html?colour=pink">Pink</a
            ><span class="filter-spacer"></span
            ><span data-results-count class="small text-muted"></span
            ><select id="sortProducts" aria-label="Sort products">
              <option value="featured">Featured</option>
              <option value="new">Newest</option>
              <option value="price-low">Price: low to high</option>
              <option value="price-high">Price: high to low</option>
            </select>
          </div>
          <div class="product-grid" data-product-grid></div>
        </div>
      </section>
    </main>
    <div id="site-footer-root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/filters.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
